spring:
  application:
    name: climAlert
    temperaturaAlerta: ${CLIM_ALERT_TEMPERATURE:35}
    humedadAlerta: ${CLIM_ALERT_HUMIDITY:60}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

weather:
  api:
    base-url: ${WEATHER_API_BASE_URL:https://api.weatherapi.com/v1}
    api-key: ${WEATHER_API_KEY:}
    city: ${WEATHER_CITY:Buenos Aires}
